name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          python -m pytest

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t 8byte-app:${IMAGE_TAG} \
            ./app

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 8byte-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Tag Docker Image
        run: |
          docker tag \
            8byte-app:${IMAGE_TAG} \
            ${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}

  deploy-backend:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --query "Command.CommandId" \
            --output text \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY }}",
              "docker pull ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker image prune -af || true",
              "docker run -d --restart always --name app -p 80:80 ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
            ]')

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

  notify-failure:

    if: failure()

    needs:
      - build
      - deploy-backend

    runs-on: ubuntu-latest

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "8Byte Deployment Failed"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.SMTP_USERNAME }}

          body: |
            Deployment failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Workflow: ${{ github.workflow }}

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}